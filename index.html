<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모노폴리 능력치 전환 룰렛</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>모노폴리 능력치 전환 룰렛</h1>

    <div class="characters">

      <div class="character-box">
        <table>

          <colgroup>
            <col style="width: 25%;">
            <col style="width: 75%;">
          </colgroup>

          <tr>
            <th colspan="2" class="character-name">
              <input type="text" value="이름">
            </th>
          </tr>

          <tr>
            <td class="name-cell">강점</td>
            <td>
              <input
                type="text"
                id="strongInput"
                placeholder="쉼표로 구분">
            </td>
          </tr>

          <tr>
            <td class="name-cell">보통</td>
            <td>
              <input
                type="text"
                placeholder="쉼표로 구분">
            </td>
          </tr>

          <tr>
            <td class="name-cell">약점</td>
            <td>
              <input
                type="text"
                id="weakInput"
                placeholder="쉼표로 구분">
            </td>
          </tr>

        </table>
      </div>

    </div>

    <div class="top-buttons">
      <button id="rouletteBtn">룰렛 돌리기</button>
    </div>

    <div class="result-box" id="resultBox">
      <div class="result-title">결과:</div>

      <div class="result-line" id="mainResult"></div>

      <div class="result-line" id="detailResult"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
